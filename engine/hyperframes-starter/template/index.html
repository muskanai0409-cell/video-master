<!doctype html>
<html lang="en" data-composition-variables='[{"id":"headline","type":"string","label":"Headline","default":"memory for your agents"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Vendored, never a CDN: a render-time fetch breaks determinism (see ASSETS.md) -->
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("assets/fonts/Geist.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono.ttf") format("truetype"); font-weight: 100 900; font-display: block; }

      /* Brand constants (video-master references/brand.md), shared by every scene file.
         The film's style card picks everything else. */
      :root {
        --white: #ffffff;
        --paper: #f4f4f6;
        --ink: #0b1015;
        --ink-45: #919395;
        --blue: #0562ef;
        --blue-deep: #0450c8;
        --on-blue: #f4f8ff;
        --brand-ink: #0b1b41;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--white); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Geist", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

      /* The hook lives on the root because render-time --variables only reach the root
         composition (tested on 0.8.181). Scene files get values only from their host's
         static data-variable-values. */
      /* block, not flex: a flex container drops the space before an inline accent span */
      #hook { position: absolute; left: 160px; top: 50%; width: 1400px; display: block;
              font-size: 120px; font-weight: 500; line-height: 1.05; letter-spacing: -0.035em; }
      #hook .key { color: var(--blue); }
    </style>
  </head>
  <body>
    <!-- Top-level clips only; anything with nested layout goes in a scene file under compositions/
         (lint: nested_structure_needs_subcomposition). Host id, inner root id and timeline key match. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-fps="60" data-width="1920" data-height="1080">
      <!-- static default text: the fonts gate only waits for faces used in static markup (#5112) -->
      <h1 id="hook" class="clip" data-start="0" data-duration="3.5" data-track-index="0">memory for your <span class="key">agents</span></h1>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
           data-start="3.5" data-duration="2.5" data-track-index="1" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const v = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
      if (v.headline) {
        const words = String(v.headline).split(" ");
        // the last word carries the one accent; everything else stays ink
        document.getElementById("hook").innerHTML =
          words.map((w, i) => i === words.length - 1 ? `<span class="key">${w}</span>` : w).join(" ");
      }

      // centre with yPercent (a CSS transform would fight the y tween)
      gsap.set("#hook", { yPercent: -50 });
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#hook", { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.15);
      tl.to("#hook", { y: -18, opacity: 0, duration: 0.25, ease: "power2.in" }, 3.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
