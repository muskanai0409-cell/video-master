<!doctype html><html><head><title>capture inbox</title></head><body style="font:14px system-ui;padding:24px">
<p>local capture inbox (writes to the scratchpad only)</p>
<input id="f" type="file" multiple>
<pre id="log"></pre>
<script>
const log = document.getElementById('log');
document.getElementById('f').addEventListener('change', async e => {
  for (const file of e.target.files) {
    const name = (document.title.split('|')[1] || file.name).trim();
    const r = await fetch('/save?name=' + encodeURIComponent(name), {method:'POST', body: file});
    log.textContent += name + ' ' + file.size + ' ' + r.status + '\n';
  }
  e.target.value = '';
});
</script></body></html>
